<!doctype html>
<html lang="en">
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Great Number Game</title>
  </head>
  <body class="d-flex justify-content-center p-5">
    <div
      class="card w-50 align-self-center d-flex align-content-center flex-wrap"
    >
      <div class="card-body">
        <h1 class="card-title">GUESS THE NUMBER:</h1>
        <form action="/" method="post">
          {% csrf_token %}
          <input type="number" name="guess" style="height: 40px" />
          <button type="submit" name="submit" class="btn-solid theme-accent">
            Guess
          </button>
        </form>
        <div>
          {% if message %} {% if "Correct" in message %}
          <div
            class="alert alert-success text-center mt-3 bg-success"
            role="alert"
          >
            {{ message }}
          </div>
          {% else %}
          <div
            class="alert alert-danger text-center mt-3 bg-danger"
            role="alert"
          >
            {{ message }}
          </div>
          {% endif %} {% endif %}
        </div>
        <div>
          <p class="card-text">Attempts: {{ attempts }}</p>
        </div>

        <a href="/clear/"
          ><button class="btn-solid theme-accent">Rety</button></a
        >
      </div>
    </div>
  </body>
</html>
