<!doctype html>
<html lang="en">
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body class="d-flex justify-content-center m-5">
    <div class="card">
      <div class="card-header">Current Date & Time</div>
      <div class="card-body">
        <h4 class="card-title">Today's Date:</h4>
        <p class="card-text">{{ date }}</p>
        <h4 class="card-title">The time is</h4>
        <p class="card-text">
          With supporting text below as a natural lead-in to additional content.
        </p>
      </div>
    </div>
  </body>
</html>
