<!doctype html>
<html lang="en">
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
  </head>
  <body class="d-flex align-content-center flex-wrap justify-content-center">
    <form action="/result/" , method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label for="Name" class="form-label">Name:</label>
        <input
          type="name"
          class="form-control"
          id="name"
          name="name"
          aria-describedby="emailHelp"
        />
        <div id="emailHelp" class="form-text">Please enter your full name.</div>
      </div>
      <div>
        <div class="col-auto">
          <label for="autoSizingSelect">Location: </label>
          <select class="form-control" id="autoSizingSelect" name="location">
            <option selected>Choose...</option>
            <option value="Palestine">Palestine</option>
            <option value="Greece">Greece</option>
            <option value="United States">United States</option>
          </select>
        </div>
      <div>
        <div class="col-auto">
          <label for="autoSizingSelect">Favourite Language: </label>
          <select class="form-control" id="autoSizingSelect" name="language">
            <option selected>Choose...</option>
            <option value="JavaScript">JavaScript</option>
            <option value="HTML">HTML</option>
            <option value="Python">Python</option>
          </select>
        </div>
      </div>

      <div class="form-field">
        <label for="fieldTextarea" class="form-label">Comment:</label>
        <textarea
          class="form-control"
          id="fieldTextarea"
          rows="3"
          name="comment"
        ></textarea>
      </div>

      <button type="submit" class="btn-solid theme-primary">Submit</button>
    </form>
