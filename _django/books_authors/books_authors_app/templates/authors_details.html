<!doctype html>
<html lang="en">
  <head>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authors</title>
  </head>
  <body>
    <h1>Details of the Author:</h1>
    <h2>{{ author.first_name }} {{ author.last_name }}</h2>
    <p>ID: {{ author.id }}</p>
    <p>Notes: {{ author.notes }}</p>

    <p>My books:</p>
    <ul>
      {% for book in books%}
      <li>{{book.title}}</li>
      {% endfor %}
    </ul>

    <h2>Add a book to this author</h2>

    <form action="/authors/{{ author.id }}/add-book/" method="post">
      {% csrf_token %}
      <select name="book_id">
        {% for book in books %}
        <option value="{{ book.id }}">{{ book.title }}</option>
        {% endfor %}
      </select>
      <button type="submit">Add Book</button>
    </form>
    <a href="/">Back to home</a>
  </body>
</html>
