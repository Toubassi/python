<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit the Show</title>
  </head>
  <body>
    <a href="/"><button>Go Home</button></a>
    <h1>{{ show.title }}</h1>
    <form action="/shows/{{show.id}}/update/" method="post">
      {% csrf_token %}
      <label for="title">Title</label>
      <input type="text" name="title" id="title" value="{{show.title}}" />
      <label for="network">Network:</label>
      <input type="text" name="network" id="network" value="{{show.network}}" />
      <label for="release_date">Release Date:</label>
      <input
        type="date"
        name="release_date"
        id="release_date"
        value="{{show.release_date}}"
      />
      <label for="desc">Description:</label>
      <input type="text" name="desc" id="desc" value="{{show.desc}}" />
      <input type="submit" value="Update" />
    </form>
    {% if messages %}
    <ul>
      {% for message in messages %}
      <li>{{message}}</li>
      {% endfor %}
    </ul>
    {% endif%}
  </body>
</html>
