<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter</title>
  </head>
  <body>
    <h1>Counter</h1>
    <p>{{ request.session.number }} times</p>
    <form action="/destroy" method="get">
      {% csrf_token %}
      <button type="submit" value="Reset">Reset</button>
    </form>
    <form action="/decrease" method="get">
      {% csrf_token %}
      <button type="submit" value="decrease">-2</button>
    </form>
  </body>
</html>
