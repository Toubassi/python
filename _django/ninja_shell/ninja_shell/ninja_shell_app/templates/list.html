<!doctype html>
<html lang="en">
  <head>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dojos & Ninjas List</title>
  </head>
  <body>
    <h1>Dojos & Ninjas List</h1>
    <ul>
      {% for dojo in dojos %}
      <li>{{ dojo.name }}</li>
      <ul>
        {% for ninja in dojo.ninjas.all %}
        <li>{{ ninja.first_name }}</li>
        {% endfor %}
      </ul>
      {% endfor %}
    </ul>
    <a href="/">Go back</a>
  </body>
</html>
